send_raw_commands:
  name: Send raw adapter commands
  description: >
    Send AT/ST/OBD commands straight to the BLE OBD adapter and return the replies.
    Does not reset the adapter first (no ATZ). Use it to read or change adapter
    settings such as sleep behaviour (e.g. STSLCS, STSLU off, off).
  fields:
    commands:
      name: Commands
      description: One command per list item, sent in order.
      required: true
      example: '["STI", "STSLCS"]'
      selector:
        object:
    notify:
      name: Post notification
      description: Also post the replies as a persistent notification.
      default: true
      selector:
        boolean:

sweep_dids:
  name: Sweep DIDs
  description: >
    Brute-force ReadDataByIdentifier over DID ranges on the given ECUs, store the
    result, and post a notification. If an earlier run with a different label
    exists, the DIDs whose bytes changed are listed — run once while charging and
    once unplugged to find the charging-status DID. Polling pauses during the sweep.
  fields:
    ecus:
      name: ECUs
      description: Request headers to sweep. Default 7E4 (BECM), 7E5 (BCCM), 7E6.
      example: '["7E4", "7E5"]'
      selector:
        object:
    ranges:
      name: DID ranges
      description: Hex ranges LO-HI. Default 4900-49FF, D900-D9FF, DD00-DDFF.
      example: '["4900-49FF", "DD00-DDFF"]'
      selector:
        object:
    label:
      name: Label
      description: Car state for this run (e.g. charging, unplugged). Defaults to the current poll mode.
      example: charging
      selector:
        text:
